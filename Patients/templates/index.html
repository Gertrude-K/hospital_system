{% extends 'base.html' %}
{% load static %}

{% block title %}Registration Form{% endblock %}

{% block content %}
<style>
  .register-wrap {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    background: #eef5f4;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .register-card,
  .register-card *,
  .register-card *::before,
  .register-card *::after {
    box-sizing: border-box;
  }

  .register-card {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    border: 1px solid #d3e3e1;
    border-top: 5px solid #0f766e;
    border-radius: 10px;
    padding: 2.25rem 2rem;
    box-shadow: 0 10px 30px rgba(15, 118, 110, 0.12);
  }

  .register-card h2 {
    margin: 0 0 0.25rem;
    font-size: 1.75rem;
    font-weight: 700;
    color: #0b3b38;
  }

  .register-card .subtitle {
    margin: 0 0 1.5rem;
    color: #5b7270;
    font-size: 0.95rem;
  }

  /* Django's form.as_p wraps each field in a <p> */
  .register-card form p {
    margin: 0 0 1.1rem;
  }

  .register-card label {
    display: block;
    margin-bottom: 0.35rem;
    font-weight: 600;
    font-size: 0.9rem;
    color: #0b3b38;
  }

  .register-card input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
  .register-card select,
  .register-card textarea {
    width: 100%;
    padding: 0.7rem 0.85rem;
    font-size: 1rem;
    font-family: inherit;
    color: #12312f;
    background: #f8fbfb;
    border: 1px solid #b9cfcc;
    border-radius: 6px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .register-card input:focus,
  .register-card select:focus,
  .register-card textarea:focus {
    outline: none;
    background: #ffffff;
    border-color: #0f766e;
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.2);
  }

  /* Help text under fields (for example password rules) */
  .register-card .helptext {
    display: block;
    margin-top: 0.35rem;
    font-size: 0.8rem;
    line-height: 1.4;
    color: #5b7270;
  }

  .register-card .helptext ul {
    margin: 0.25rem 0 0;
    padding-left: 1.1rem;
  }

  /* Validation errors from Django */
  .register-card .errorlist {
    list-style: none;
    margin: 0 0 0.5rem;
    padding: 0.5rem 0.75rem;
    font-size: 0.85rem;
    color: #8a1f1f;
    background: #fdeeee;
    border-left: 4px solid #c0392b;
    border-radius: 4px;
  }

  .register-card button[type="submit"] {
    width: 100%;
    margin-top: 0.5rem;
    padding: 0.8rem;
    font-size: 1rem;
    font-weight: 600;
    color: #ffffff;
    background: #0f766e;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .register-card button[type="submit"]:hover {
    background: #0b5c56;
  }

  .register-card button[type="submit"]:focus-visible {
    outline: 3px solid #f2a93b;
    outline-offset: 2px;
  }

  .register-card .login-link {
    margin: 1.5rem 0 0;
    text-align: center;
    font-size: 0.9rem;
    color: #5b7270;
  }

  .register-card .login-link a {
    color: #0f766e;
    font-weight: 600;
    text-decoration: none;
  }

  .register-card .login-link a:hover {
    text-decoration: underline;
  }
</style>

<div class="register-wrap">
  <div class="register-card">
    <h2>Register Here</h2>
    <p class="subtitle">Create an account to use the patient dashboard.</p>

    <form action="" method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Register</button>
    </form>

    <p class="login-link">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
  </div>
</div>
{% endblock %}
